<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!--
    If you are serving your web app from the local filesystem or inside
    Electron, use a relative base path so assets load correctly.
    For Chrome/web debug, the base href must be absolute.
  -->
    <base href="/" />

    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="A new Flutter project." />

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="desktop_app" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>desktop_app</title>
    <link rel="manifest" href="manifest.json" />
    <style>
      @font-face {
        font-family: "NotoSansArabic";
        src: url("assets/assets/fonts/NotoSansArabic-Regular.ttf")
          format("truetype");
        font-weight: 400;
        font-style: normal;
        font-display: block;
        unicode-range: U+0600-06FF;
      }

      @font-face {
        font-family: "NotoSansArabic";
        src: url("assets/assets/fonts/NotoSansArabic-Bold.ttf")
          format("truetype");
        font-weight: 700;
        font-style: normal;
        font-display: block;
        unicode-range: U+0600-06FF;
      }

      html,
      body,
      flt-glass-pane,
      flt-scene-host {
        height: 100%;
        margin: 0;
        background: #eff3f6;
        font-family:
          "Segoe UI", Tahoma, Arial, "NotoSansArabic", Helvetica, sans-serif;
      }

      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #183153;
        direction: rtl;
        text-align: center;
        z-index: 9999;
      }

      #app-loading-card {
        max-width: 420px;
        padding: 22px 24px;
      }

      #app-loading-spinner {
        width: 34px;
        height: 34px;
        margin: 0 auto 14px;
        border: 4px solid #d8e1e8;
        border-top-color: #3390ec;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }

      #app-loading-title {
        font-size: 17px;
        font-weight: 700;
        margin-bottom: 6px;
      }

      #app-loading-message {
        font-size: 13px;
        color: #6b7c8c;
        line-height: 1.6;
        white-space: pre-wrap;
      }

      #app-loading.error #app-loading-spinner {
        display: none;
      }

      #app-loading.error #app-loading-title {
        color: #b42318;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app-loading">
      <div id="app-loading-card">
        <div id="app-loading-spinner"></div>
        <div id="app-loading-title">جاري تشغيل التطبيق</div>
        <div id="app-loading-message">يتم تحميل ملفات التطبيق من الجهاز.</div>
      </div>
    </div>
    <script>
      window.addEventListener("flutter-first-frame", function () {
        var loader = document.getElementById("app-loading");
        if (loader) {
          loader.remove();
        }
      });

      function showStartupError(message) {
        var loader = document.getElementById("app-loading");
        if (!loader) {
          return;
        }
        loader.className = "error";
        var title = document.getElementById("app-loading-title");
        var body = document.getElementById("app-loading-message");
        if (title) {
          title.textContent = "فشل تشغيل التطبيق";
        }
        if (body) {
          body.textContent = message || "حصل خطأ أثناء تحميل التطبيق.";
        }
      }

      window.addEventListener("error", function (event) {
        showStartupError(event.message || "JavaScript error");
      });

      window.addEventListener("unhandledrejection", function (event) {
        var reason = event.reason;
        showStartupError(
          reason && reason.message
            ? reason.message
            : String(reason || "Unhandled promise rejection"),
        );
      });

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .getRegistrations()
          .then(function (registrations) {
            return Promise.all(
              registrations.map(function (registration) {
                return registration.unregister();
              }),
            );
          })
          .catch(function () {});
      }
    </script>
    <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
    <script>
      window.flutterConfiguration = {
        useColorEmoji: false
      };
    </script>
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
