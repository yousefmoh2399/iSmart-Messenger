function AddStripe4MatrixMobile1(titleCol, dataCol, DMflag){

}
str += '<td></td><td width = 1% rowspan = 15 ></td>';
str += '</tr>';
str += GetLineTwo2();
for(var i=0;i<dataCol.length;i++)
{
alternate = i;
halfalternate = (alternate / 2);
makewhole = (Math.floor(halfalternate));
if(makewhole == halfalternate) {evenorodd = "even"} else evenorodd = "odd";
if(evenorodd == "even")
{str += '<tr height =45px valign="middle" bgcolor="#d8d8d8">';}
else
{str += '<tr height =45px valign="middle">';}
for(var j=0;j<4;j++)
{
if(dataCol[i][j] == '') dataCol[i][j] = tSpace;
if(j == 0) {
str+='<td width = 10% valign = "middle" id="imgcommon">&nbsp;&nbsp;<img  align="center" src="../images/'+dataCol[i][j]+'" border = 0></td>';
}else {
str+='<td width = 10% valign = "middle" id="imgcommon">&nbsp;&nbsp;<img align="center" src="../images/'+dataCol[i][j]+'" border = 0></td>';
}
j++;
if(j == 1)
str+='<td width = 40% valign = "middle"   id="tdValue"  >'+dataCol[i][j]+ '</td>';
else
str+='<td width =46% valign = "middle"   id="tdValue"  colspan = 1>'+dataCol[i][j]+ '</td>';


}
str += '</tr><tr height = 1%><td ></td></tr>';
if(i < 3)
str += GetLineTwo2();
}
str += strEndTable;
str += '</div>';
output(str);
}
