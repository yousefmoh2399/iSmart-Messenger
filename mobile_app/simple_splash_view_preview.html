<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple Splash View Preview</title>
  <style>
    :root { color-scheme: light dark; --splash-bg-light:#F4F5F7; --splash-bg-dark:#050505; --splash-text-light:#1E1E1E; --splash-text-dark:#FAFAFA; --splash-indicator-light:#FF5722; --splash-indicator-dark:#FFC107; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:64px 0 24px; box-sizing:border-box; font-family:Inter,Arial,sans-serif; background:var(--splash-bg-light); color:var(--splash-text-light); transition:background .2s ease,color .2s ease; overflow:auto; }
    body.theme-dark { background:var(--splash-bg-dark); color:var(--splash-text-dark); }
    .preview-frame { width:390px; height:844px; display:grid; place-items:center; transform:scale(var(--preview-scale)); transform-origin:center; }
    @media (min-height: 900px) { :root { --preview-scale:.78; } }
    @media (max-height: 899px) { :root { --preview-scale:.68; } }
    @media (max-width: 520px) { :root { --preview-scale:.58; } }
    .phone { width:390px; height:844px; border-radius:42px; border:12px solid #111827; box-shadow:0 24px 80px #0004; position:relative; overflow:hidden; background:inherit; }
    .visual { position:absolute; left:50%; width:200px; height:200px; border-radius:36px; display:grid; place-items:center; background:transparent; transform:translateX(-50%); font-size:48px; overflow:hidden; z-index:1; top:310px; }
    .visual img { width:100%; height:100%; object-fit:contain; display:block; }
    .visual .lottie-preview { width:100%; height:100%; display:grid; place-items:center; }
    .visual .lottie-fallback { padding:18px; text-align:center; font-size:14px; line-height:1.35; background:transparent; }
    .loader { position:absolute; left:50%; width:72px; height:72px; display:grid; place-items:center; transform:translateX(-50%); top:704px; color:var(--splash-indicator-light); z-index:2; }
    body.theme-dark .loader { color:var(--splash-indicator-dark); }
    .text { position:absolute; left:24px; right:24px; text-align:center; font-size:16px; line-height:1.25; z-index:3; top:792px; }
    .dots { width:100%; height:100%; display:flex; align-items:center; justify-content:center; gap:12%; }
    .dots span { display:block; width:clamp(2px,18%,10px); aspect-ratio:1; border-radius:999px; background:currentColor; animation:b 900ms infinite ease-in-out; }
    .dots span:nth-child(2){ animation-delay:150ms; } .dots span:nth-child(3){ animation-delay:300ms; }
    .pulse { width:100%; height:100%; border-radius:999px; background:currentColor; animation:p 900ms infinite ease-in-out; }
    .wave, .bounce { width:100%; height:100%; display:flex; align-items:center; justify-content:center; gap:12%; }
    .wave span { width:14%; height:100%; border-radius:999px; background:currentColor; animation:wave 800ms infinite ease-in-out; transform-origin:center center; }
    .wave span:nth-child(2), .bounce span:nth-child(2) { animation-delay:120ms; }
    .wave span:nth-child(3), .bounce span:nth-child(3) { animation-delay:240ms; }
    .bounce span { width:22%; aspect-ratio:1; border-radius:999px; background:currentColor; animation:bounce 760ms infinite ease-in-out; }
    .orbit { width:100%; height:100%; position:relative; animation:r 1100ms linear infinite; }
    .orbit span { position:absolute; left:50%; width:24%; aspect-ratio:1; margin-left:-12%; border-radius:999px; background:currentColor; }
    .orbit span:first-child { top:0; }
    .orbit span:last-child { bottom:0; opacity:.45; }
    .linear { width:100%; height:100%; border-radius:999px; position:relative; overflow:hidden; }
    .linear::before { content:""; position:absolute; inset:0; border-radius:999px; background:currentColor; opacity:.22; }
    .linear span { position:absolute; inset:0; display:block; width:100%; height:100%; border-radius:999px; background:currentColor; transform-origin:left center; animation:w 900ms infinite alternate; }
    .circular { width:100%; height:100%; border:max(2px, calc(min(72px, 72px) * .12)) solid currentColor; border-right-color:transparent; border-radius:999px; animation:r 800ms linear infinite; box-sizing:border-box; }
    .theme-tools { position:fixed; top:18px; left:50%; transform:translateX(-50%); display:flex; gap:8px; padding:8px; border-radius:999px; background:#0f172acc; backdrop-filter:blur(12px); }
    .theme-tools button { border:0; border-radius:999px; padding:8px 12px; cursor:pointer; color:#f8fafc; background:#334155; font-weight:700; }
    .theme-tools button.active { background:#ff5722; color:white; }
    @keyframes r { to { rotate:360deg; } } @keyframes p { 50% { scale:.72; opacity:.65; } } @keyframes b { 50% { opacity:.25; translate:0 35%; } } @keyframes w { from { scale:.28 1; opacity:.4; } to { scale:1 1; opacity:1; } } @keyframes wave { 50% { transform:scaleY(.35); opacity:.55; } } @keyframes bounce { 50% { transform:translateY(-45%); opacity:.65; } }
  </style>
</head>
<body>
  <div class="theme-tools">
    <button type="button" data-theme-button="light" onclick="setPreviewTheme('light')">Light</button>
    <button type="button" data-theme-button="dark" onclick="setPreviewTheme('dark')">Dark</button>
    <button type="button" data-theme-button="system" onclick="setPreviewTheme('system')">System</button>
  </div>
  <div class="preview-frame">
    <main class="phone">
      <div class="visual"><img src="assets/images/logo.png" alt="Splash visual"></div>
      <div class="loader"><div class="dots"><span></span><span></span><span></span></div></div>
      <div class="text">Copyright © 2026 Yousef Mohamed</div>
    </main>
  </div>
  
  <script>
  const configuredPreviewTheme = 'system';
  function setPreviewTheme(theme) {
    const resolved = theme === 'system'
      ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      : theme;
    document.body.classList.toggle('theme-dark', resolved === 'dark');
    document.querySelectorAll('[data-theme-button]').forEach(function(button) {
      button.classList.toggle('active', button.dataset.themeButton === theme);
    });
    localStorage.setItem('simpleSplashPreviewTheme', theme);
  }
  setPreviewTheme(localStorage.getItem('simpleSplashPreviewTheme') || configuredPreviewTheme);
  if (typeof EventSource !== 'undefined' && location.protocol.startsWith('http')) {
    const events = new EventSource('/__simple_splash_events');
    events.onmessage = function (event) {
      if (event.data === 'reload') location.reload();
    };
  }
  if (location.protocol.startsWith('http')) {
    let version = null;
    setInterval(async function () {
      try {
        const response = await fetch('/__simple_splash_version', { cache: 'no-store' });
        const next = await response.text();
        if (version === null) {
          version = next;
        } else if (version !== next) {
          location.reload();
        }
      } catch (_) {}
    }, 700);
  }
  </script>
</body>
</html>
